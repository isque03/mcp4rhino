name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag matching manifest.yml; e.g. v0.7.2-alpha (dispatch on release/0.7.2-alpha)"
        required: true
        type: string

concurrency:
  group: publish-yak
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate tag input
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-alpha(\.[1-9][0-9]*)?)?$ ]]; then
            echo "Expected a stable release tag or a supported alpha tag." >&2
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate release version and source
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py metadata "$INPUT_TAG" "$GITHUB_REF" > "$RUNNER_TEMP/release.json"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/release.json" >> "$GITHUB_ENV"
          BRANCH="$(jq -r .BUILD_BRANCH "$RUNNER_TEMP/release.json")"
          test "$(git cat-file -t "refs/tags/$INPUT_TAG")" = tag
          SHA="$(git rev-parse HEAD)"
          test "$SHA" = "$(git rev-parse "refs/tags/$INPUT_TAG^{commit}")"
          git merge-base --is-ancestor "$SHA" "origin/$BRANCH"
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Download yak package from successful Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          bash scripts/ci-download-build-artifact.sh "$SHA" dist "$BUILD_BRANCH"
          PKG="dist/MCP4Rhino-${VERSION}.yak"
          bash scripts/verify-yak-package.sh "$PKG" "$VERSION"
          test -s "dist/MCP4Rhino-${VERSION}-skills.zip"
          test -s dist/grasshopper-smoke.py
          cmp scripts/grasshopper-smoke.py dist/grasshopper-smoke.py
          if [[ "$VERSION" == 0.7.2* ]]; then
            test -s dist/grasshopper-compatibility-smoke.py
            cmp scripts/grasshopper-compatibility-smoke.py dist/grasshopper-compatibility-smoke.py
          fi

      - name: Download Yak CLI
        id: yak
        run: |
          set -euo pipefail
          YAK_PATH="$(bash scripts/ci-download-yak.sh)"
          echo "path=${YAK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Reject duplicate Yak version
        env:
          YAK: ${{ steps.yak.outputs.path }}
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${YAK_TOKEN:-}" ]]; then
            echo "YAK_TOKEN secret is missing. Add it as a production environment secret only." >&2
            exit 1
          fi
          python3 scripts/release_checks.py registry "$YAK" "$VERSION"

      - name: Push to Yak Package Manager
        env:
          YAK: ${{ steps.yak.outputs.path }}
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        run: |
          set -euo pipefail
          PKG="dist/MCP4Rhino-${VERSION}.yak"
          test -f "$PKG"
          if ! "$YAK" push "$PKG"; then
            echo "FAILED PUBLISH: yak push failed for $PKG." >&2
            exit 1
          fi
          echo "Pushed MCP4Rhino ${VERSION} (universal) to yak.rhino3d.com"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ inputs.tag }}
          name: MCP4Rhino ${{ env.VERSION }}
          files: |
            dist/MCP4Rhino-${{ env.VERSION }}.yak
            dist/MCP4Rhino-${{ env.VERSION }}-skills.zip
            dist/grasshopper-smoke.py
            dist/grasshopper-compatibility-smoke.py
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## MCP4Rhino ${{ env.VERSION }}

            Universal package (`MCP4Rhino-${{ env.VERSION }}.yak`) for Rhino 8 on macOS and Windows.

            ${{ env.PRERELEASE == 'true' && '**Prerelease for native testing.** Stable promotion waits for explicit tester confirmation.' || 'Stable release.' }}

            In Rhino PackageManager, search **MCP4Rhino**, select this version and install/update. For alpha versions, enable **Include pre-releases**. Apply and restart Rhino completely. Confirm the version with `get_support_info`, then run `gh_help` and `gh_status`.

            Use disposable documents. Follow the [Grasshopper tester checklist](https://github.com/isque03/mcp4rhino/blob/${{ inputs.tag }}/docs/GRASSHOPPER.md#alpha-tester-checklist). Download both `grasshopper-smoke.py` and `grasshopper-compatibility-smoke.py` into the same folder for native checks; they need only Python 3 and the running MCP server. See the [compatibility acceptance matrix](https://github.com/isque03/mcp4rhino/blob/${{ inputs.tag }}/docs/GRASSHOPPER_EXTENSIBILITY.md).

            ${{ env.PRERELEASE == 'true' && 'To leave the alpha: explicitly reinstall the current stable package and restart Rhino. Clearing Include pre-releases alone does not downgrade the installed plugin.' || '' }}

            Also published to McNeel's Package Manager (search **MCP4Rhino** after index refresh).

            See [CHANGELOG.md](https://github.com/isque03/mcp4rhino/blob/${{ inputs.tag }}/CHANGELOG.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
